[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "long-rwkv-evidence"
version = "0.2.0"
description = "Paper and exact evidence for linear-cost diffusion with long contexts"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[tool.setuptools.packages.find]
include = ["lrwkv_evidence*"]
namespaces = true

[tool.pytest.ini_options]
addopts = "--confcutdir=."
testpaths = ["tests_portable"]
