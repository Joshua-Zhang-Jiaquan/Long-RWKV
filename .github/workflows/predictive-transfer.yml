name: Prospective transfer protocol
on:
  push:
    branches: [revision/predictive-transfer-20260923]
  workflow_dispatch:
jobs:
  cpu-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==1.26.4 pytest
      - run: python tools/verify_transfer_protocol.py
      - run: python -m pytest -q revision/transfer/test_feasibility.py revision/transfer/test_prediction.py
      - run: python tools/verify_release.py
